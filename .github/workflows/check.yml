name: CheckMarkdown
on: pull_request

permissions:
  contents: read

jobs:
  MdValidator:
    name: MdValidator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - working-directory: page
        run: npm ci
      - name: Parse Markdowns
        working-directory: tools
        run: |
          npm ci
          node mdValidator.js
          node mdParser.js
          node checkCountries.js
      - name: Run tool tests
        working-directory: tools
        run: npm test
      - name: Run Tests
        working-directory: page
        run: npm test -- --run

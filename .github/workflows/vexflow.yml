name: VEX Triage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write
  attestations: write

jobs:
  vexflow-update:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Install vexflow
        run: go install github.com/carabiner-dev/vexflow@latest

      - name: Run vexflow update
        env:
          GITHUB_TOKEN: ${{ secrets.VEXFLOW_TOKEN }}
        run: |
          vexflow update \
            --repo scraly/developers-conferences-agenda \
            --branch main \
            --triage-repo scraly/developers-conferences-agenda
